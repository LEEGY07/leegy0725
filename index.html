<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RawDrop">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg">
<title>RawDrop</title>
<script src="peerjs.min.js"></script>
<script src="qrcode.min.js"></script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--card2:#f7f7fa;--tx:#111;--sub:#6e6e73;--line:rgba(0,0,0,.08);--ac:#4f46e5;--ac2:#3b82f6;--ok:#22c55e;--bad:#ef4444;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--tx:#f5f5f7;--sub:#98989f;--line:rgba(255,255,255,.1);--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:620px;margin:auto;padding:0 18px}
.hide{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* 상단 */
.top{display:flex;align-items:center;gap:10px;padding:18px 0 8px}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0;flex:1}
.top .back{background:none;border:0;color:var(--ac);font-size:17px;display:flex;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
.chip{border:0;background:var(--card);color:var(--tx);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:var(--sh);display:flex;gap:6px;align-items:center;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
/* 카드 */
.hero{width:100%;border:0;border-radius:24px;padding:22px;display:flex;align-items:center;gap:16px;color:#fff;text-align:left;cursor:pointer;
  background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 30px rgba(79,70,229,.35);margin:8px 0 22px}
.hero .ic{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.hero .ic svg{width:28px;height:28px}
.hero b{display:block;font-size:20px;margin-bottom:3px}.hero span{font-size:14px;opacity:.85}
.st{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 8px;font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.3px}
.st button{background:none;border:0;color:var(--ac);font-size:15px;font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0}
.list{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;color:inherit;text-align:left;font:inherit}
.item:last-child{border-bottom:0}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;flex:none;position:relative}
.av .dot{position:absolute;right:0;bottom:0;border:2px solid var(--card)}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-size:16px;font-weight:600}.item .tx span{font-size:13px;color:var(--sub)}
.item .chev{color:var(--sub)}
.empty{padding:26px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.5}
.note{font-size:13px;color:var(--sub);margin:10px 4px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin:14px 4px}
/* 버튼 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;background:var(--ac);color:#fff;font-family:inherit}
.btn.gray{background:var(--card2);color:var(--tx)}.btn.red{background:rgba(239,68,68,.12);color:var(--bad)}
.btn:disabled{opacity:.4}.btn.sm{padding:9px 14px;font-size:14px;width:auto;border-radius:999px}
.row{display:flex;gap:10px}.row>*{flex:1}
input[type=text]{width:100%;padding:14px 16px;font-size:17px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-family:inherit;outline:none}
input[type=text]:focus{border-color:var(--ac)}
/* 진행 */
.prog{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);margin:8px 0 14px}
.prog .h{display:flex;align-items:center;gap:12px}.prog .h b{font-size:16px}.prog .h span{font-size:13px;color:var(--sub)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .25s}
.prog .s{font-size:13px;color:var(--sub);margin-top:8px}
/* 그리드 */
.tools{display:flex;align-items:center;gap:8px;margin:6px 2px 10px}.tools .c{flex:1;font-size:14px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:14px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.cell{position:relative;aspect-ratio:1;background:var(--card2);overflow:hidden;cursor:pointer}
.cell img,.cell video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cell .nm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--sub);padding:6px;word-break:break-all;text-align:center}
.cell .ck{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.2);z-index:3;display:flex;align-items:center;justify-content:center;color:#fff;opacity:0;transition:opacity .15s}
.grid.selmode .cell .ck{opacity:1}
.cell.sel .ck{background:var(--ac);opacity:1}.cell.sel .ck::after{content:'';width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:translateY(-1px) rotate(-45deg)}
.cell.sel img,.cell.sel video{transform:scale(.88);border-radius:8px;transition:transform .15s}
.cell .pg{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--ok);z-index:2}
.cell .bd{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:6px;z-index:2;backdrop-filter:blur(4px)}
.cell.wait{opacity:.5}
/* 하단 바 */
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:20}
.dock .in{max-width:620px;margin:auto}
.to{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.to::-webkit-scrollbar{display:none}
.to button{flex:none;display:flex;align-items:center;gap:8px;border:2px solid transparent;background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px 6px 6px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.to button .av{width:30px;height:30px;font-size:13px}.to button.on{border-color:var(--ac)}
/* 시트 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:21px;margin:4px 0 6px;text-align:center}.sheet p{color:var(--sub);font-size:14px;text-align:center;margin:0 0 16px;line-height:1.5}
.qrbox{background:#fff;border-radius:20px;padding:16px;width:240px;margin:0 auto 10px}.qrbox img{width:100%;display:block}
.cam{position:relative;width:100%;aspect-ratio:1;border-radius:20px;overflow:hidden;background:#000;margin-bottom:12px}
.cam video{width:100%;height:100%;object-fit:cover}.cam::after{content:'';position:absolute;inset:18%;border:3px solid rgba(255,255,255,.9);border-radius:20px}
@keyframes up{from{transform:translateY(100%)}}@keyframes fd{from{opacity:0}}
/* 토스트 */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(30,30,32,.92);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;backdrop-filter:blur(10px);animation:fd .2s;max-width:90vw;text-align:center}
/* 뷰어 */
.viewer{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.viewer .vh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#fff}
.viewer .vh .t{flex:1;font-size:13px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .vb{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.viewer .vb img,.viewer .vb video{max-width:100%;max-height:100%}
.viewer button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.viewer .vf{display:flex;justify-content:space-between;align-items:center;padding:10px 14px calc(14px + env(safe-area-inset-bottom));color:#fff;font-size:13px}
</style>
</head>
<body>
<div class="wrap">

<!-- 홈 -->
<section id="vHome">
  <div class="top"><h1>RawDrop</h1><button class="chip" id="meChip"><span class="dot" id="meDot"></span><span id="meName">내 폰</span></button></div>
  <button class="hero" id="bPick"><div class="ic"><svg class="i"><use href="#i-up"/></svg></div><div><b>사진·영상 보내기</b><span>원본 그대로 · 화질 손실 없이</span></div></button>
  <div class="st">내 기기 <button id="bAdd">+ 기기 연결</button></div>
  <div class="list" id="contacts"></div>
  <div class="pill"><span class="dot" id="lDot"></span><span id="lTxt">연결 중…</span></div>
  <div class="st">더 보기</div>
  <div class="list">
    <button class="item" id="bCollect"><div class="av" style="background:linear-gradient(135deg,#f59e0b,#ef4444)"><svg class="i"><use href="#i-qr"/></svg></div><div class="tx"><b>QR로 사진 모으기</b><span>행사에서 손님 사진을 원본으로 받기</span></div><svg class="i chev"><use href="#i-r"/></svg></button>
    <button class="item hide" id="bInstall"><div class="av" style="background:linear-gradient(135deg,#22c55e,#14b8a6)"><svg class="i"><use href="#i-dl"/></svg></div><div class="tx"><b>앱으로 설치하기</b><span>홈 화면에 아이콘 추가</span></div><svg class="i chev"><use href="#i-r"/></svg></button>
    <button class="item hide" id="bIosInstall"><div class="av" style="background:linear-gradient(135deg,#22c55e,#14b8a6)"><svg class="i"><use href="#i-dl"/></svg></div><div class="tx"><b>앱으로 설치하기</b><span>Safari 공유 버튼 → 홈 화면에 추가</span></div></button>
  </div>
</section>

<!-- 보낼 사진 고르기 -->
<section id="vPick" class="hide">
  <div class="top"><button class="back" data-home><svg class="i"><use href="#i-l"/></svg>홈</button><span style="flex:1"></span><label class="btn sm gray" for="files" style="margin:0">+ 추가</label></div>
  <div class="tools"><span class="c" id="pCnt"></span><button class="btn sm gray" id="pAll">전체 선택</button></div>
  <div class="grid selmode" id="pGrid"></div>
  <p class="note" id="iosTip">💡 아이폰 원본 화질: 사진 고를 때 위쪽 <b>옵션 → ‘현재’</b> 선택</p>
  <p class="note">길게 누른 채 쓸면 여러 장을 한 번에 선택/해제할 수 있어요.</p>
</section>

<!-- 보내는 중 -->
<section id="vSend" class="hide">
  <div class="top"><h1 style="font-size:24px" id="sTitle">보내는 중</h1></div>
  <div class="prog"><div class="h"><div class="av" id="sAv"></div><div style="flex:1"><b id="sTo"></b><br><span id="sStat">연결 중…</span></div></div><div class="bar"><i id="sBar"></i></div><div class="s" id="sSub"></div></div>
  <div class="grid" id="sGrid"></div>
</section>

<!-- 받은 사진 -->
<section id="vRecv" class="hide">
  <div class="top"><button class="back" data-home><svg class="i"><use href="#i-l"/></svg>홈</button><span style="flex:1"></span><button class="btn sm gray hide" id="rClear">선택 해제</button></div>
  <div class="prog"><div class="h"><div class="av" id="rAv"></div><div style="flex:1"><b id="rFrom"></b><br><span id="rStat"></span></div></div><div class="bar"><i id="rBar"></i></div><div class="s" id="rSub"></div></div>
  <div class="tools"><span class="c" id="rCnt"></span></div>
  <div class="grid" id="rGrid"></div>
  <p class="note">사진을 누르면 크게 보여요. 길게 누르면 골라서 저장할 수 있어요.</p>
</section>

<!-- QR 사진 모으기 -->
<section id="vCollect" class="hide">
  <div class="top"><button class="back" data-home><svg class="i"><use href="#i-l"/></svg>홈</button></div>
  <h1 style="font-size:26px;margin:4px 0 6px">QR로 사진 모으기</h1>
  <p class="note">손님이 QR을 찍어 보낸 원본 사진이 내 구글 드라이브에 모여요.</p>
  <div id="cSet">
    <p class="note">처음 한 번: 구글 PhotoDrop 웹 앱 주소를 붙여넣으세요.</p>
    <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <div style="height:10px"></div><button class="btn" id="bSaveUrl">저장</button>
  </div>
  <div id="cGo" class="hide"><button class="btn" id="bAdmin">방 만들기 · QR · 사진 관리 열기</button><div style="height:10px"></div><button class="btn gray" id="bEditUrl">주소 변경</button></div>
</section>
</div>

<!-- 하단 바 -->
<div class="dock hide" id="pDock"><div class="in">
  <div class="to" id="pTo"></div>
  <button class="btn" id="bGo" disabled>보내기</button>
</div></div>
<div class="dock hide" id="sDock"><div class="in"><button class="btn gray" id="sDone" disabled>완료</button></div></div>
<div class="dock hide" id="rDock"><div class="in"><div class="row">
  <button class="btn" id="rSave" style="flex:2.2"><svg class="i"><use href="#i-dl"/></svg><span id="rSaveTx">모두 저장</span></button>
  <button class="btn gray" id="rMore" style="flex:1">더보기</button>
</div></div></div>

<input type="file" id="files" multiple accept="image/*,video/*" class="hide">

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3M21 14v.01M14 21h7v-4"/></symbol>
  <symbol id="i-r" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-l" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></symbol>
</svg>

<script>
'use strict';
/* ================= 공통 ================= */
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const OPT=Q.get('host')?{host:Q.get('host'),port:+Q.get('port')||443,path:Q.get('path')||'/',secure:Q.get('secure')!=='0'}:{};
const PID=id=>'rawdrop2-'+id;
const fmt=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':b>=1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
const fmtT=s=>!isFinite(s)||s<0?'':s>=60?Math.floor(s/60)+'분 '+Math.round(s%60)+'초':Math.max(1,Math.round(s))+'초';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const IMG=/\.(jpe?g|png|gif|webp|heic|heif|avif|bmp|dng)$/i,VID=/\.(mov|mp4|m4v|webm|3gp|mkv|avi)$/i;
const isVid=it=>(it.type||'').startsWith('video/')||VID.test(it.name);
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.userAgent));
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const rid=n=>{const a='abcdefghjkmnpqrstuvwxyz23456789',b=crypto.getRandomValues(new Uint8Array(n));return[...b].map(x=>a[x%a.length]).join('')};
const COLORS=[['#6366f1','#3b82f6'],['#ec4899','#f43f5e'],['#f59e0b','#f97316'],['#10b981','#14b8a6'],['#8b5cf6','#d946ef'],['#0ea5e9','#06b6d4']];
function avatar(el,c){const k=[...c.id].reduce((a,ch)=>a+ch.charCodeAt(0),0)%COLORS.length;el.style.background=`linear-gradient(135deg,${COLORS[k][0]},${COLORS[k][1]})`;el.firstChild?.nodeType===3?el.firstChild.textContent=[...c.name][0]||'?':el.prepend(document.createTextNode([...c.name][0]||'?'));}
function toast(t,ms=2600){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),ms);}
function sheet(html){const m=document.createElement('div');m.className='mask';m.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
  m.onclick=e=>{if(e.target===m)close();};const close=()=>{m.dispatchEvent(new Event('close'));m.remove();};m.close=close;document.body.append(m);return m;}
let wake=null;async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.onrelease=()=>wake=null;}if(!on&&wake){await wake.release();wake=null;}}catch{}}
let busy=false;addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue='';}});

const VIEWS=['vHome','vPick','vSend','vRecv','vCollect'],DOCK={vPick:'pDock',vSend:'sDock',vRecv:'rDock'};
function go(v){VIEWS.forEach(x=>$(x).classList.toggle('hide',x!==v));['pDock','sDock','rDock'].forEach(d=>$(d).classList.toggle('hide',DOCK[v]!==d));scrollTo(0,0);if(v==='vHome')renderContacts();}
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{if(busy)return toast('전송이 끝날 때까지 기다려 주세요');go('vHome');});

/* ================= 내 정보 / 연결된 기기 ================= */
let me=load('rd_me');
if(!me){me={id:rid(10),name:IOS?'내 아이폰':/Android/.test(navigator.userAgent)?'내 갤럭시':'내 컴퓨터'};save('rd_me',me);}
let contacts=load('rd_contacts')||[];const online={};
const findC=id=>contacts.find(c=>c.id===id);
function addContact(id,name){const c=findC(id);if(c){c.name=name;}else contacts.push({id,name,at:Date.now()});save('rd_contacts',contacts);renderContacts();}
function renderContacts(){
  $('meName').textContent=me.name;
  const L=$('contacts');L.innerHTML='';

let peer=null;const pending=new Map();
function setListen(on,txt){$('lDot').classList.toggle('on',on);$('meDot').classList.toggle('on',on);$('lTxt').textContent=txt||(on?'받을 준비 완료 · 앱을 켜 두면 사진을 받을 수 있어요':'서버에 다시 연결하는 중…');}
function startPeer(){
  peer=new Peer(PID(me.id),OPT);
  peer.on('open',()=>{setListen(true);pingAll();if(pairHash)doPair(...pairHash),pairHash=null;});
  peer.on('disconnected',()=>{setListen(false);setTimeout(()=>{if(!peer.destroyed&&peer.disconnected)peer.reconnect();},1500);});
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){const id=(String(e.message).match(/rawdrop2-([a-z0-9]+)/)||[])[1];pending.get(id)?.(new Error('offline'));}
    else if(e.type==='unavailable-id')setListen(false,'다른 창에서 RawDrop이 열려 있어요');
    else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){setListen(false);setTimeout(()=>{if(!peer.destroyed&&peer.disconnected)peer.reconnect();},3000);}
  });
  peer.on('connection',onConn);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(peer&&!peer.destroyed&&peer.disconnected)peer.reconnect();if(busy)keepAwake(true);pingAll();});
function connectTo(id,ms=12000){return new Promise((res,rej)=>{
  const c=peer.connect(PID(id),{reliable:true,serialization:'raw'});
  const fail=e=>{clearTimeout(t);pending.delete(id);try{c.close();}catch{}rej(e);};
  const t=setTimeout(()=>fail(new Error('offline')),ms);pending.set(id,fail);
  c.on('open',()=>{clearTimeout(t);pending.delete(id);res(c);});c.on('error',fail);});}
function waitMsg(c,pred,ms){return new Promise((res,rej)=>{const t=setTimeout(()=>{c.off('data',h);rej(new Error('timeout'));},ms);
  const h=d=>{if(typeof d!=='string')return;let m;try{m=JSON.parse(d);}catch{return;}if(pred(m)){clearTimeout(t);c.off('data',h);res(m);}};c.on('data',h);
  c.on('close',()=>{clearTimeout(t);rej(new Error('closed'));});});}

let pingT=0;async function pingAll(){if(!peer||peer.disconnected||Date.now()-pingT<4000)return;pingT=Date.now();
  await Promise.all(contacts.map(async c=>{try{const x=await connectTo(c.id,7000);send(x,{t:'ping',id:me.id,name:me.name});online[c.id]=true;setTimeout(()=>x.close(),500);}catch{online[c.id]=false;}}));

async function scanQR(video,onText){
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video.srcObject=s;await video.play();
  let det=null;try{if('BarcodeDetector'in window&&(await BarcodeDetector.getSupportedFormats()).includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']});}catch{}
  if(!det&&!window.jsQR)await new Promise((r,j)=>{const sc=document.createElement('script');sc.src='jsqr.min.js';sc.onload=r;sc.onerror=j;document.head.append(sc);});
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let alive=true;
  const stop=()=>{alive=false;s.getTracks().forEach(t=>t.stop());};
  (async function loop(){while(alive){await sleep(180);if(!video.videoWidth)continue;let txt=null;
    try{if(det){const r=await det.detect(video);txt=r[0]?.rawValue;}else{const w=Math.min(640,video.videoWidth),h=Math.round(video.videoHeight*w/video.videoWidth);cv.width=w;cv.height=h;cx.drawImage(video,0,0,w,h);txt=jsQR(cx.getImageData(0,0,w,h).data,w,h)?.data;}}catch{}

/* ================= 그리드 (길게 눌러 드래그 선택) ================= */
function Grid(el,onChange,opt={}){
  const items=[];let down=null,drag=null,timer=null,xy=null,raf=0;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);render(e.target._it);}}),{rootMargin:'500px'});
  const selMode=()=>opt.alwaysSel||items.some(i=>i.sel);
  function add(it){const c=document.createElement('div');c.className='cell';c.dataset.i=items.length;c._it=it;
    c.innerHTML='<div class="nm"></div><div class="ck"></div><div class="pg"></div><div class="bd hide"></div>';
    c.querySelector('.nm').textContent=it.name;it.cell=c;items.push(it);el.append(c);paint(it);if(it.file)io.observe(c);return it;}
  function setFile(it){it.cell.classList.remove('wait');io.observe(it.cell);}
  function render(it){const f=it.file;if(!f)return;const url=it.url||(it.url=URL.createObjectURL(f));
    if(isVid(it)){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='metadata';
      v.onloadedmetadata=()=>badge(it,'▶ '+Math.floor(v.duration/60)+':'+String(Math.floor(v.duration%60)).padStart(2,'0'));v.onerror=()=>{v.remove();badge(it,'▶ 동영상');};
      v.src=url+'#t=0.1';it.cell.prepend(v);}
    else{const im=new Image();im.decoding='async';im.draggable=false;im.onload=()=>it.cell.querySelector('.nm').style.visibility='hidden';
      im.onerror=()=>{im.remove();badge(it,(it.name.split('.').pop()||'').toUpperCase());};im.src=url;it.cell.prepend(im);}}
  function badge(it,t){const b=it.cell.querySelector('.bd');b.textContent=t;b.classList.remove('hide');}
  function paint(it){it.cell.classList.toggle('sel',!!it.sel);}
  const sync=()=>{el.classList.toggle('selmode',selMode());onChange();};
  const idxAt=(x,y)=>{const c=document.elementFromPoint(x,y)?.closest?.('.cell');return c&&el.contains(c)?+c.dataset.i:-1;};
  function apply(cur){const a=Math.min(drag.start,cur),b=Math.max(drag.start,cur);items.forEach((it,k)=>{const v=k>=a&&k<=b?drag.mode:drag.snap[k];if(it.sel!==v){it.sel=v;paint(it);}});sync();}
  function begin(i){drag={start:i,last:i,mode:!items[i].sel,snap:items.map(x=>x.sel)};apply(i);navigator.vibrate?.(12);loop();}
  function loop(){if(!drag)return;if(xy){const[x,y]=xy,h=innerHeight;if(y<90)scrollBy(0,-Math.max(4,(90-y)/3));else if(y>h-170)scrollBy(0,Math.max(4,(y-(h-170))/3));
      const i=idxAt(x,y);if(i>=0&&i!==drag.last){drag.last=i;apply(i);}}raf=requestAnimationFrame(loop);}
  el.addEventListener('pointerdown',e=>{const c=e.target.closest('.cell');if(!c||e.button>0)return;const i=+c.dataset.i;down={i,x:e.clientX,y:e.clientY,moved:false};xy=[e.clientX,e.clientY];
    timer=setTimeout(()=>begin(i),e.pointerType==='mouse'?220:300);});
  addEventListener('pointermove',e=>{if(!down)return;xy=[e.clientX,e.clientY];
    if(!drag&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>10){clearTimeout(timer);down.moved=true;if(e.pointerType==='mouse'){begin(down.i);}}});
  const end=e=>{clearTimeout(timer);cancelAnimationFrame(raf);
    if(down&&!drag&&!down.moved&&e.type==='pointerup'){const it=items[down.i];
      if(!selMode()&&opt.onTap)opt.onTap(it);else{it.sel=!it.sel;paint(it);sync();}}
    down=null;drag=null;xy=null;};
  addEventListener('pointerup',end);addEventListener('pointercancel',end);
  el.addEventListener('touchmove',e=>{if(drag)e.preventDefault();},{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
  return{items,add,setFile,badge,paint,sync,all(v){items.forEach(it=>{it.sel=v;paint(it);});sync();},sel(){return items.filter(it=>it.sel);},
    clear(){items.forEach(it=>it.url&&URL.revokeObjectURL(it.url));items.length=0;el.innerHTML='';sync();}};
}

async function sendAll(x,items,total){
  const dc=x.dataChannel,pc=x.peerConnection;
  const CH=Math.max(16384,Math.min(pc.sctp?.maxMessageSize||65536,65536)),HIGH=8<<20;dc.bufferedAmountLowThreshold=2<<20;
  const drain=()=>new Promise((res,rej)=>{if(dc.readyState!=='open')return rej(new Error('연결이 끊겼어요'));if(dc.bufferedAmount<HIGH)return res();
    const t=()=>{dc.removeEventListener('close',c);res();},c=()=>rej(new Error('연결이 끊겼어요'));dc.addEventListener('bufferedamountlow',t,{once:true});dc.addEventListener('close',c,{once:true});});
  const t0=performance.now();let sent=0,lastUI=0;
  for(let n=0;n<items.length;n++){const it=items[n],f=it.file,bar=it.cell.querySelector('.pg');
    send(x,{t:'meta',name:f.name,size:f.size,type:f.type,mtime:f.lastModified});
    for(let off=0;off<f.size;){const slab=await f.slice(off,off+(4<<20)).arrayBuffer();
      for(let p=0;p<slab.byteLength;p+=CH){await drain();dc.send(slab.slice(p,p+CH));}
      off+=slab.byteLength;sent+=slab.byteLength;const now=performance.now();
      if(now-lastUI>150||off>=f.size){lastUI=now;bar.style.width=(100*off/f.size)+'%';const sp=sent/((now-t0)/1000);
        $('sBar').style.width=(100*sent/total)+'%';$('sStat').textContent=`${n+1} / ${items.length}개 보내는 중`;
        $('sSub').textContent=`${fmt(sent)} / ${fmt(total)} · ${fmt(sp)}/s · 남은 시간 ${fmtT((total-sent)/sp)}`;}}
    bar.style.width='0';it.cell.style.opacity='.55';}
  await drain();send(x,{t:'bye'});
  $('sStat').textContent=`${items.length}개 · ${fmt(total)} 전송 완료`;$('sSub').textContent=`원본 그대로 보냈어요 · ${fmtT((performance.now()-t0)/1000)} 걸림`;$('sBar').style.width='100%';
}

/* ================= 받기 ================= */
let opfs=null,recvBusy=false;
const rg=Grid($('rGrid'),updRecv,{onTap:it=>it.file&&openViewer(it)});
(async()=>{try{const r=await navigator.storage.getDirectory();for await(const k of r.keys())await r.removeEntry(k,{recursive:true}).catch(()=>{});
  const h=await r.getFileHandle('__p',{create:true});const w=await h.createWritable();await w.write(new Uint8Array(1));await w.close();await r.removeEntry('__p');opfs=r;navigator.storage.persist?.();}catch{opfs=null;}})();
function onConn(x){
  let from=null,cur=null,q=Promise.resolve(),job=null,lastUI=0;
  x.on('data',d=>{q=q.then(()=>handle(d)).catch(e=>{$('rStat').textContent='수신 오류: '+e.message;});});
  x.on('close',()=>{if(job&&!job.done){busy=recvBusy=false;keepAwake(false);$('rStat').textContent='⚠️ 연결이 끊겼어요 — 받은 것까지만 저장돼요';}});
  async function handle(d){
    if(typeof d==='string'){const m=JSON.parse(d);
      if(m.t==='hello'||m.t==='ping'){from={id:m.id,name:m.name};if(findC(m.id)){online[m.id]=true;const c=findC(m.id);if(c.name!==m.name){c.name=m.name;save('rd_contacts',contacts);}}
        if(m.pair){addContact(m.id,m.name);send(x,{t:'hello',id:me.id,name:me.name});online[m.id]=true;toast(`💗 ${m.name} 연결 완료!`);}
        if(!$('vHome').classList.contains('hide'))renderContacts();return;}
      if(m.t==='offer'){if(recvBusy||busy)return send(x,{t:'reject',why:'busy'});
        const who=from&&findC(from.id)?findC(from.id).name:(from?.name||'알 수 없는 기기');
        const ok=from&&findC(from.id)?true:await askAccept(who,m);   // 연결된 기기는 자동 수락
        if(!ok)return send(x,{t:'reject'});
        job={count:m.count,total:m.total,done:0,files:0,t0:performance.now()};recvBusy=busy=true;keepAwake(true);
        rg.clear();go('vRecv');const fc=from?findC(from.id)||from:{id:'x',name:who};$('rFrom').textContent=`${fc.name}님이 보내는 사진`;$('rAv').textContent='';avatar($('rAv'),fc);
        $('rBar').style.width='0';$('rSave').disabled=true;toast(`📥 ${who}님이 ${m.count}개를 보내요`);
        if(!opfs&&m.total>1.5e9)toast('⚠️ 용량이 커서 나눠 받는 걸 권장해요',4000);
        return send(x,{t:'accept'});}
      if(m.t==='meta'){cur={name:m.name,size:m.size,type:m.type,mtime:m.mtime,got:0,sel:false};rg.add(cur).cell.classList.add('wait');
        if(opfs){cur.fh=await opfs.getFileHandle('r'+Date.now()+rid(4),{create:true});cur.w=await cur.fh.createWritable();}else cur.parts=[];
        if(!m.size)await finish();return;}
      if(m.t==='bye'){job.done=true;busy=recvBusy=false;keepAwake(false);$('rBar').style.width='100%';
        $('rStat').textContent=`${job.files}개 · ${fmt(job.done?job.total:0)} 받기 완료 ✓`;$('rSub').textContent=`원본 그대로 받았어요 · ${fmtT((performance.now()-job.t0)/1000)} 걸림`;
        $('rSave').disabled=false;updRecv();toast('✅ 다 받았어요! 아래 ‘모두 저장’을 눌러 주세요',3500);}
      return;}
    const buf=d instanceof ArrayBuffer?d:d.buffer?d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength):await new Blob([d]).arrayBuffer();
    if(cur.w)await cur.w.write(buf);else cur.parts.push(buf);cur.got+=buf.byteLength;job.doneB=(job.doneB||0)+buf.byteLength;
    const now=performance.now();if(now-lastUI>150||cur.got>=cur.size){lastUI=now;cur.cell.querySelector('.pg').style.width=(100*cur.got/cur.size)+'%';
      const sp=job.doneB/((now-job.t0)/1000);$('rBar').style.width=(100*job.doneB/job.total)+'%';
      $('rStat').textContent=`${job.files+1} / ${job.count}개 받는 중`;$('rSub').textContent=`${fmt(job.doneB)} / ${fmt(job.total)} · ${fmt(sp)}/s · 남은 시간 ${fmtT((job.total-job.doneB)/sp)}`;}
    if(cur.got>=cur.size)await finish();
  }
  async function finish(){const f=cur;cur=null;let blob;
    if(f.w){await f.w.close();blob=await f.fh.getFile();}else{blob=new Blob(f.parts);f.parts=null;}
    f.file=new File([blob],f.name,{type:f.type||'application/octet-stream',lastModified:f.mtime});f.cell.querySelector('.pg').style.width='0';
    rg.setFile(f);job.files++;if(f.file.size!==f.size)rg.badge(f,'⚠️ 손상');updRecv();}
}
function askAccept(who,m){return new Promise(res=>{const s=sheet(`<h2>📥 사진을 받을까요?</h2><p><b></b>님이 ${m.count}개 (${fmt(m.total)})를 보내려고 해요</p><div class="row"><button class="btn gray" id="no">거절</button><button class="btn" id="yes">받기</button></div>`);
  s.querySelector('b').textContent=who;let done=false;const fin=v=>{if(done)return;done=true;s.close();res(v);};
  s.querySelector('#yes').onclick=()=>fin(true);s.querySelector('#no').onclick=()=>fin(false);s.addEventListener('close',()=>fin(false));setTimeout(()=>fin(false),80000);});}
function updRecv(){const all=rg.items.filter(i=>i.file),s=rg.sel().filter(i=>i.file);
  $('rCnt').textContent=s.length?`${s.length}개 선택됨`:`${all.length}개 · ${fmt(all.reduce((a,b)=>a+b.size,0))}`;
  $('rSaveTx').textContent=s.length?`선택한 ${s.length}개 저장`:'모두 저장';$('rClear').classList.toggle('hide',!s.length);}
$('rClear').onclick=()=>rg.all(false);
const toSave=()=>{const s=rg.sel().filter(i=>i.file);return s.length?s:rg.items.filter(i=>i.file);};
const markSaved=it=>rg.badge(it,'✓ 저장됨');
const canShareFiles=()=>{try{return!!navigator.canShare?.({files:[new File([''],'a.jpg',{type:'image/jpeg'})]});}catch{return false;}};
// 아이폰: 공유 시트(사진에 저장) / 갤럭시: 다운로드(갤러리 'Download' 앨범)
$('rSave').onclick=()=>IOS&&canShareFiles()?shareSave(toSave()):dlSave(toSave());
let shareQ=null;
async function shareSave(list){
  if(!shareQ){shareQ={b:[],k:0};let cur=[],sz=0;for(const it of list){if(cur.length&&(cur.length>=40||sz+it.size>1.5e9)){shareQ.b.push(cur);cur=[];sz=0;}cur.push(it);sz+=it.size;}if(cur.length)shareQ.b.push(cur);}
  const b=shareQ.b[shareQ.k];
  try{await navigator.share({files:b.map(i=>i.file)});b.forEach(markSaved);shareQ.k++;}catch(e){if(e.name!=='AbortError')toast('저장 실패: '+e.message);}
  if(shareQ.k>=shareQ.b.length){shareQ=null;updRecv();toast('✅ 저장 완료');}else $('rSaveTx').textContent=`다음 묶음 저장 (${shareQ.k+1}/${shareQ.b.length})`;
}
async function dlSave(list){toast(`${list.length}개 저장 중… (여러 파일 다운로드를 ‘허용’해 주세요)`,3500);
  for(const it of list){const a=document.createElement('a');a.href=it.url||(it.url=URL.createObjectURL(it.file));a.download=it.name;document.body.append(a);a.click();a.remove();markSaved(it);await sleep(350);}
  toast('✅ 갤러리의 ‘Download’ 앨범에 저장됐어요',3500);}
$('rMore').onclick=()=>{const list=toSave();
  const m=sheet(`<h2>${list.length}개 저장하기</h2><p>원하는 방법을 고르세요</p>
    ${canShareFiles()?'<button class="btn" id="m1">공유 / 사진 앱에 저장</button><div style="height:10px"></div>':''}
    ${'showDirectoryPicker'in window?'<button class="btn gray" id="m2">폴더 골라서 저장</button><div style="height:10px"></div>':''}
    <button class="btn gray" id="m3">다운로드 폴더에 저장</button><div style="height:10px"></div><button class="btn gray" id="m4">선택하기 (길게 눌러도 돼요)</button>`);
  m.querySelector('#m1')?.addEventListener('click',()=>{m.close();shareSave(list);});
  m.querySelector('#m2')?.addEventListener('click',()=>{m.close();dirSave(list);});
  m.querySelector('#m3').onclick=()=>{m.close();dlSave(list);};
  m.querySelector('#m4').onclick=()=>{m.close();if(rg.items[0]){rg.items[0].sel=true;rg.paint(rg.items[0]);rg.sync();}};};
async function dirSave(list){let root;try{root=await showDirectoryPicker({id:'rawdrop',mode:'readwrite',startIn:'pictures'});}catch{return;}
  const d=new Date(),p=n=>String(n).padStart(2,'0'),dir=await root.getDirectoryHandle(`RawDrop_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`,{create:true});
  for(const it of list){let n=it.name,k=1;const mm=n.match(/^(.*?)(\.[^.]*)?$/);for(;;){try{await dir.getFileHandle(n);n=`${mm[1]} (${k++})${mm[2]||''}`;}catch{break;}}
    let fh;try{fh=await dir.getFileHandle(n,{create:true});}catch{fh=await dir.getFileHandle(n.replace(/[^\x20-\x7e]/g,'_'),{create:true});}
    await it.file.stream().pipeTo(await fh.createWritable());markSaved(it);}
  toast(`✅ ${root.name}/${dir.name} 폴더에 저장했어요`,3500);}

/* ================= 크게 보기 ================= */
function openViewer(start){
  const list=rg.items.filter(i=>i.file);let k=list.indexOf(start);
  const v=document.createElement('div');v.className='viewer';
  v.innerHTML=`<div class="vh"><button id="vx"><svg class="i"><use href="#i-x"/></svg></button><div class="t"></div><button id="vs"><svg class="i"><use href="#i-share"/></svg></button></div>
    <div class="vb"></div><div class="vf"><button id="vp"><svg class="i"><use href="#i-l"/></svg></button><span class="n"></span><button id="vn"><svg class="i"><use href="#i-r"/></svg></button></div>`;
  document.body.append(v);const body=v.querySelector('.vb');
  const show=()=>{const it=list[k];body.innerHTML='';const u=it.url||(it.url=URL.createObjectURL(it.file));
    if(isVid(it)){const e=document.createElement('video');e.src=u;e.controls=true;e.playsInline=true;body.append(e);}else{const e=new Image();e.src=u;body.append(e);}
    v.querySelector('.t').textContent=`${it.name} · ${fmt(it.size)}`;v.querySelector('.n').textContent=`${k+1} / ${list.length}`;};
  const mv=d=>{k=(k+d+list.length)%list.length;show();};
  v.querySelector('#vx').onclick=()=>v.remove();v.querySelector('#vp').onclick=()=>mv(-1);v.querySelector('#vn').onclick=()=>mv(1);
  v.querySelector('#vs').onclick=()=>{const it=list[k];canShareFiles()?navigator.share({files:[it.file]}).then(()=>markSaved(it)).catch(()=>{}):dlSave([it]);};
  let sx=null;body.addEventListener('pointerdown',e=>sx=e.clientX);body.addEventListener('pointerup',e=>{if(sx!=null&&Math.abs(e.clientX-sx)>50)mv(e.clientX<sx?1:-1);sx=null;});
  show();}

/* ================= QR 사진 모으기 (구글 드라이브) ================= */
const gasGet=()=>localStorage.getItem('gas_url')||'';
function collectUI(){const u=gasGet();$('cSet').classList.toggle('hide',!!u);$('cGo').classList.toggle('hide',!u);$('gasUrl').value=u;}
$('bCollect').onclick=()=>{go('vCollect');collectUI();};
$('bSaveUrl').onclick=()=>{const u=$('gasUrl').value.trim().replace(/\?.*$/,'');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u))return toast('주소 형식이 맞지 않아요 (…/exec 로 끝나야 해요)',3500);localStorage.setItem('gas_url',u);collectUI();};
$('bEditUrl').onclick=()=>{localStorage.removeItem('gas_url');collectUI();};
$('bAdmin').onclick=()=>window.open(gasGet()+'?admin','_blank');

/* ================= 설치 ================= */
let installEvt=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('bInstall').classList.remove('hide');});
$('bInstall').onclick=async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;$('bInstall').classList.add('hide');};
if(IOS&&!(matchMedia('(display-mode: standalone)').matches||navigator.standalone))$('bIosInstall').classList.remove('hide');
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

renderContacts();startPeer();
</script>
